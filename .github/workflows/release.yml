name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps (Tauri)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop/src-tauri
          tagName: v__VERSION__
          releaseName: "DevNote v__VERSION__"
          releaseBody: |
            First public release (unsigned preview).

            macOS: open the .dmg, drag DevNote to /Applications.
            Unsigned build — first launch: right-click → Open (or `xattr -cr /Applications/DevNote.app`).
            Windows: NSIS installer may trigger a SmartScreen warning (unsigned).
            Linux: AppImage (`chmod +x DevNote_*_amd64.AppImage && ./DevNote_*_amd64.AppImage`) or .deb. Works on GNOME and tiling WMs (Hyprland) — drop the bundled .desktop entry into ~/.local/share/applications/ for launchers.

            Notes live in `~/devnote` (macOS/Linux) / `%USERPROFILE%/devnote` (Windows) as plain Markdown.
          releaseDraft: false
          prerelease: true
